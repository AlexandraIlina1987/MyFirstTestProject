<div class="tours-page">
  <div class="search-container">
    <mat-form-field>
      <!-- старый (input)="searchTours($event)" запускает поиск немедленно -->
      <!--<input (input)="searchTours($event)" matInput placeholder="search..." /> -->
      <!--#searchInput — это переменная шаблона, которая ссылается на конкретный HTML-элемент-->
      <input #searchInput matInput placeholder="Search tours..." />
    </mat-form-field>
  </div>

  @if (tours?.length) {
    <div
      class="d-flex flex-wrap tour-wrap"
      appHighlightActive
      #highLightDirective
      selector=".tour-item"
      [initFirst]="true"
      (onEnter)="onEnter($event)"
    >
      @for (item of tours; track item.id; let i = $index) {
        <mat-card class="tour-item" [attr.data-tour-id]="item.id" [attr.index]="i">
          <mat-card-title class="tour-type">{{ item.type ? item.type : 'single' }} </mat-card-title>
          <mat-card-content>
            <img src="/img/{{ item.img }}" alt="img" />
            <h5>{{ item.name }}</h5>

            <p>{{ item.description }}</p>
            <p>{{ item.date | date: 'dd.MM.yyyy' }}</p>

            <mat-card-actions>
              <button matButton (click)="goToTour(item)">Details</button>
            </mat-card-actions>
          </mat-card-content>
        </mat-card>
      }
    </div>
  } @else if (toursLoaded) {
    <p>No tours found</p>
  }
</div>
