<div>
  <p>{{ tour?.description }}</p>
  <h2>{{ tour?.name }}</h2>
  <p>Date: {{ tour?.date | date: 'dd.MM.yyyy' }}</p>
  <p>By Now: {{ tour?.price }}</p>
  <p>Tour Operator: {{ tour?.tourOperator }}</p>
  <p>Type: {{ tour?.type }}</p>

  <button [routerLink]="['/tour', tour.id, 'order']" matButton="filled">Book Now</button>
</div>
