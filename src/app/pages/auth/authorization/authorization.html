<div class="d-flex flex-column mt-3 authorization-wrap">
  <p>Your Login: {{ login }}</p>
  <div>
    <input
      required
      placeholder="Login"
      [ngClass]="{ 'input-error': login.length < 3 }"
      [(ngModel)]="login"
    />
  </div>
  <div>
    <input
      type="password"
      placeholder="Password"
      [ngClass]="{ 'input-error': !password || password.length < 6 }"
      [(ngModel)]="password"
    />
  </div>
</div>
<div class="mt-3 d-flex justify-content-center">
  <button matButton="filled" (click)="onAuth($event)">Sign In</button>
</div>
