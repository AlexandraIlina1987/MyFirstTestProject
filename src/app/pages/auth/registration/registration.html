<div class="d-flex flex-column mt-3 registration-wrap">
  <p>Your Login: {{ login }}</p>
  <div>
    <input
      placeholder="Login"
      [ngClass]="{ 'input-error': login.length < 3 }"
      [(ngModel)]="login"
    />
  </div>
  <div>
    <input type="email" placeholder="Email" [ngClass]="{ 'input-error': login.length < 3 }" />
  </div>
  <div>
    <input
      type="password"
      placeholder="Password"
      [ngClass]="{ 'input-error': password.length < 6 }"
      [(ngModel)]="password"
    />
  </div>
  <div>
    <input
      type="password"
      placeholder="Password Repeat"
      [ngClass]="{ 'input-error': passwordRepeat != password }"
      [(ngModel)]="passwordRepeat"
    />
  </div>
</div>
<div class="mt-3 d-flex justify-content-center">
  <button
    matButton="filled"
    (click)="onAuth($event)"
    [disabled]="login.length < 3 || password.length < 6 || password !== passwordRepeat"
  >
    Registration
  </button>
</div>
